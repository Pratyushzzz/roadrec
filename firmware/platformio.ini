; RoadRec firmware for the Seeed XIAO ESP32-S3 (Sense). Uses the pioarduino platform
; (Arduino core 3.x), which is what PlatformIO's stock espressif32 platform lacks.
[env:xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
; USB CDC on boot: the XIAO has no USB-serial chip, so without this flag Serial goes out on UART0 (GPIO43/44),
; which are the very pins the GPS uses. Remove the line only if you know Serial already works without it.
; No external libraries: the IMU driver and NMEA parser are in src/. roadcore is in lib/.
